# Local ComfyUI running on CPU. Used by `cmd/genart` to generate item icon
# art via Flux Schnell (GGUF Q8). CPU-only is intentional — no GPU required;
# expect ~5-8 min per 1024x1024 image.
#
# Bring up:           docker compose up -d comfyui
# Health check:       curl http://localhost:8188/system_stats
# Tear down:          docker compose down
#
# Model + custom-node download: `./art/bootstrap.sh` (see art/README.md).
#
# Networking: the devcontainer's `kanban-net` is declared external so both
# containers can talk via DNS name `comfyui`. If that network doesn't exist
# on your machine, comment the `kanban-net` block below and use the
# `gameslop-net` block instead (compose will create it for you).
services:
  comfyui:
    image: yanwk/comfyui-boot:cu128-slim
    container_name: gameslop-comfyui
    environment:
      # --cpu forces CPU inference even though the image bundles CUDA libs.
      # --listen 0.0.0.0 is required for access from outside the container.
      CLI_ARGS: "--cpu --listen 0.0.0.0"
    ports:
      - "8188:8188"
    volumes:
      - ./art/comfy-data:/root
    restart: unless-stopped
    networks:
      - kanban-net
      # - gameslop-net

networks:
  kanban-net:
    external: true
  # gameslop-net: {}
